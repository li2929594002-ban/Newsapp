server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    # AI 问答：SSE 流式响应，必须关闭缓冲
    location /api/ai/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://backend:8000;    # 注意：末尾没有斜杠 = 保留 /api 前缀
        proxy_set_header Host $host;
    }
}