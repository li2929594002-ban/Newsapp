services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请先复制 .env.example 为 .env 并配置密码}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-news_app}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [appnet]

  redis:
    image: redis:7-alpine
    networks: [appnet]

  backend:
    build: ./toutiao_backend
    environment:
      DATABASE_URL: "mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-news_app}?charset=utf8mb4"
      REDIS_HOST: "redis"
    ports: ["8000:8000"]    # 留着方便看 /docs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [appnet]

  frontend:
    build: ./xwzx-news
    ports: ["80:80"]
    depends_on: [backend]
    networks: [appnet]

networks:
  appnet:

volumes:
  mysql_data: