services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: news_app
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [appnet]

  redis:
    image: redis:7-alpine
    networks: [appnet]

  backend:
    build: ./toutiao_backend
    environment:
      DATABASE_URL: "mysql+aiomysql://root:123456@mysql:3306/news_app?charset=utf8mb4"
      REDIS_HOST: "redis"
    ports: ["8000:8000"]    # 留着方便看 /docs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [appnet]

  frontend:
    build: ./xwzx-news
    ports: ["80:80"]
    depends_on: [backend]
    networks: [appnet]

networks:
  appnet:

volumes:
  mysql_data: